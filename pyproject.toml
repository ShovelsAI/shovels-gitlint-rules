[project]
name = "shovels-gitlint-rules"
version = "0.4.0"
description = "Shared custom gitlint rules for Shovels repos, exposed as a pre-commit hook"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gitlint-core>=0.19",
]

[project.scripts]
shovels-gitlint = "shovels_gitlint_rules.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shovels_gitlint_rules"]

[dependency-groups]
dev = [
    "pytest>=8",
    "gitlint>=0.19",
]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
